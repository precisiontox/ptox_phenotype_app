<!doctype html>
<html lang="en" data-app-root="{{ request.script_root|e }}">
<head>
    <meta charset="utf-8">
    <title>PrecisionTox Phenotype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block styles %}{% endblock %}

</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('main.index') }}" class="logo-link">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="PrecisionTox" class="logo">
        </a>

        <div class="nav-links">
            <a href="{{ url_for('main.index') }}" class="{% if request.path == '/' %}active{% endif %}">Home</a>
            <a href="{{ url_for('explore.index') }}" class="{% if request.path.startswith('/explore') %}active{% endif %}">Explore</a>
            <a href="{{ url_for('compare.heatmap') }}" class="{% if request.path.startswith('/compare') %}active{% endif %}">Compare</a>
            <a href="{{ url_for('experiments.list_experiments') }}" class="{% if request.path.startswith('/experiments') %}active{% endif %}">Experiments</a>
            <!-- <a href="/endpoints/" class="{% if request.path.startswith('/endpoints') %}active{% endif %}">Endpoints</a> -->
        </div>

        <div class="nav-links-secondary">
            <a href="{{ url_for('api.health') }}" class="{% if request.path.startswith('/api') %}active{% endif %}">API</a>
            <a href="https://dex.precisiontox.org/downloads/phenotype/">Download</a>
        </div>
    </nav>
    <!-- <hr> -->
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
